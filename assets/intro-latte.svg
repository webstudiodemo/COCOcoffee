<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760"><defs><style>
 @keyframes steamA{0%,100%{transform:translate(0,8px) scaleY(.96);opacity:.42}50%{transform:translate(-7px,-13px) scaleY(1.06);opacity:.78}}
 @keyframes steamB{0%,100%{transform:translate(0,4px);opacity:.32}50%{transform:translate(9px,-18px);opacity:.68}}
 @keyframes beanA{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-8px,-10px) rotate(-7deg)}}
 .steam-a{transform-box:fill-box;transform-origin:center;animation:steamA 3.4s ease-in-out infinite}
 .steam-b{transform-box:fill-box;transform-origin:center;animation:steamB 4.1s ease-in-out .35s infinite}
 .bean-float{transform-box:fill-box;transform-origin:center;animation:beanA 4.8s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.steam-a,.steam-b,.bean-float{animation:none}}
